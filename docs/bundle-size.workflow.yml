# ⚠️ COPY ME TO .github/workflows/bundle-size.yml
#
# This template lives under docs/ because the autonomous runner's GitHub token lacks the
# `workflow` scope, so it can't push files under .github/workflows/ itself. One-time
# manual step for Patrik:
#
#   mkdir -p .github/workflows
#   cp docs/bundle-size.workflow.yml .github/workflows/bundle-size.yml
#   git add .github/workflows/bundle-size.yml && git commit -m "ci: add bundle-size workflow" && git push
#
# (Or just create the file via the GitHub web UI → Add file → paste this content.)
# No secrets or variables required. The comparison logic lives in
# scripts/bundle-size-report.js; the budget/threshold live in package.json →
# "nextBundleAnalysis". Keep this template in sync if the workflow changes.
# ---------------------------------------------------------------------------------------

name: Bundle size

# On every PR to main: builds the base branch and the PR head, parses the First Load JS
# table from each `next build`, and posts a per-route Δ table as a sticky PR comment.
# Catches accidental bundle regressions (e.g. an eager import that re-bloats a route).
#
# Self-contained: builds BOTH refs in one job, so there's no cross-run artifact wiring
# and no "first PR has no baseline" edge case. Only first-party actions are used
# (checkout, setup-node, github-script) — no third-party trust surface.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need both base.sha and the merge sha reachable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The report script is new in this PR, so the base branch won't have it.
      # Stash it outside the worktree so it survives `git checkout <base>`.
      - name: Stash report script
        run: cp scripts/bundle-size-report.js "$RUNNER_TEMP/report.js"

      - name: Build base branch
        run: |
          set -eo pipefail
          git checkout --force --detach ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run build 2>&1 | tee "$RUNNER_TEMP/base-build.log"
          node "$RUNNER_TEMP/report.js" report "$RUNNER_TEMP/base-build.log" "$RUNNER_TEMP/base.json"

      - name: Build PR head
        run: |
          set -eo pipefail
          git checkout --force --detach ${{ github.sha }}
          npm ci
          npm run build 2>&1 | tee "$RUNNER_TEMP/head-build.log"
          node "$RUNNER_TEMP/report.js" report "$RUNNER_TEMP/head-build.log" "$RUNNER_TEMP/head.json"

      - name: Compare
        run: node "$RUNNER_TEMP/report.js" compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bundle-size-report -->';
            const body = fs.readFileSync('bundle-size-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
